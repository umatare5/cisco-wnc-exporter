# .goreleaser.yml for cisco-wnc-exporter

project_name: cisco-wnc-exporter
version: 2

# Distribution directory
dist: tmp/dist

# Build destination
github_urls:
  # set to true if you use a self-signed certificate
  skip_tls_verify: false

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - main: cmd/main.go
    id: cisco-wnc-exporter
    binary: cisco-wnc-exporter
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    ldflags:
      - -s -w -X 'github.com/umatare5/cisco-wnc-exporter/internal/cli.version={{ .Version }}'

archives:
  - name_template: "{{ .ProjectName }}-v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - "*.go"
      - "*.md"
      - "go.mod"
      - "go.sum"
      - "LICENSE"

# Docker configuration
dockers:
  - image_templates:
      - "ghcr.io/umatare5/cisco-wnc-exporter:latest-amd64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:{{ .Tag }}-amd64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}-amd64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}.{{ .Minor }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Prometheus Exporter for Cisco WNC"
      - "--label=org.opencontainers.image.url=https://github.com/umatare5/cisco-wnc-exporter"
      - "--label=org.opencontainers.image.source=https://github.com/umatare5/cisco-wnc-exporter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    goarch: amd64
    ids:
      - cisco-wnc-exporter
  - image_templates:
      - "ghcr.io/umatare5/cisco-wnc-exporter:latest-arm64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:{{ .Tag }}-arm64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}-arm64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}.{{ .Minor }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Prometheus Exporter for Cisco WNC"
      - "--label=org.opencontainers.image.url=https://github.com/umatare5/cisco-wnc-exporter"
      - "--label=org.opencontainers.image.source=https://github.com/umatare5/cisco-wnc-exporter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
    goarch: arm64
    ids:
      - cisco-wnc-exporter

# Docker manifest for multi-platform images
docker_manifests:
  - name_template: "ghcr.io/umatare5/cisco-wnc-exporter:latest"
    image_templates:
      - "ghcr.io/umatare5/cisco-wnc-exporter:latest-amd64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:latest-arm64"
  - name_template: "ghcr.io/umatare5/cisco-wnc-exporter:{{ .Tag }}"
    image_templates:
      - "ghcr.io/umatare5/cisco-wnc-exporter:{{ .Tag }}-amd64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}"
    image_templates:
      - "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}-amd64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}-arm64"
  - name_template: "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/umatare5/cisco-wnc-exporter:v{{ .Major }}.{{ .Minor }}-arm64"

release:
  prerelease: auto
  draft: false
  replace_existing_draft: true
  # The header carries a static v0.2.0 -> v0.3.0 breaking-changes section.
  # Remove that section when cutting v0.4.0.
  header: |
    ## {{ .ProjectName }} v{{ .Version }}

    This release contains the Prometheus Exporter for Cisco WNC.

    ### ⚠️ Breaking changes since v0.2.0

    Renamed and rescaled — values are now ratios in `0-1`, so divide alert
    thresholds written for the old `0-100` percentages by 100:

    | v0.2.0 | v0.3.0 |
    | :--- | :--- |
    | `wnc_ap_channel_utilization_percent` | `wnc_ap_channel_utilization_ratio` |
    | `wnc_ap_cpu_utilization_percent` | `wnc_ap_cpu_utilization_ratio` |
    | `wnc_ap_memory_utilization_percent` | `wnc_ap_memory_utilization_ratio` |
    | `wnc_ap_noise_utilization_percent` | `wnc_ap_noise_utilization_ratio` |
    | `wnc_ap_rx_utilization_percent` | `wnc_ap_rx_utilization_ratio` |
    | `wnc_ap_tx_utilization_percent` | `wnc_ap_tx_utilization_ratio` |

    Renamed:

    | v0.2.0 | v0.3.0 |
    | :--- | :--- |
    | `wnc_ap_clients_total` | `wnc_ap_clients` |
    | `wnc_ap_coverage_hole_events_total` | `wnc_ap_coverage_failed_clients` (now a Gauge) |
    | `wnc_ap_last_radar_on_radio_at` | `wnc_ap_last_radar_timestamp_seconds` (now a Gauge) |
    | `wnc_client_rx_group_counter_total` | `wnc_client_rx_group_total` |
    | `wnc_wlan_clients_total` | `wnc_wlan_clients` |

    Removed without replacement: `wnc_ap_rx_bytes_total`, `wnc_ap_rx_packets_total`,
    `wnc_ap_tx_bytes_total`, `wnc_ap_tx_packets_total`, `wnc_ap_tx_drops_total`,
    `wnc_ap_tx_errors_total`, `wnc_ap_wep_undecryptable_total`,
    `wnc_client_retry_ratio_percent`, `wnc_wlan_rx_bytes_total`,
    `wnc_wlan_tx_bytes_total`, `wnc_wlan_wpa2_enabled`,
    `wnc_wlan_11k_neighbor_list_enabled`.

    Same name, new meaning — `wnc_ap_oper_state` and `wnc_client_state` are now
    always `1` and report the state in a `state` label. `wnc_ap_oper_state`
    also drops its `radio` label and becomes one series per AP, tracking the
    AP registration state. An alert such as `wnc_ap_oper_state == 0` silently
    never fires; per-radio down detection is `wnc_ap_radio_state == 0`, which
    is unchanged, and the label rewrites are
    `wnc_ap_oper_state{state!="registered"}` and
    `wnc_client_state{state!="client-status-run"}`.

    ### 🐳 Container Images

    ```bash
    # Latest version
    docker run --rm ghcr.io/umatare5/cisco-wnc-exporter:latest --help

    # Specific version
    docker run --rm ghcr.io/umatare5/cisco-wnc-exporter:{{ .Tag }} --help

    # With environment variables
    docker run --rm -e WNC_ACCESS_TOKEN ghcr.io/umatare5/cisco-wnc-exporter:{{ .Tag }} command
    ```

    ### 📦 Binary Installation

    Download a prebuilt binary for your platform from the release assets below.

  footer: |
    **Full Changelog**: https://github.com/umatare5/cisco-wnc-exporter/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### 📚 Documentation

    - [README](https://github.com/umatare5/cisco-wnc-exporter/blob/{{ .Tag }}/README.md)
    - [Container Registry](https://github.com/umatare5/cisco-wnc-exporter/pkgs/container/cisco-wnc-exporter)

# Generate checksums for source archives
checksum:
  name_template: "{{ .ProjectName }}-v{{ .Version }}_checksums.txt"

# Changelog configuration
changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation Updates
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^Merge branch "
      - "^release:"
      - "^ci:"
      - "^test:"

# Metadata for Go proxy and pkg.go.dev
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
