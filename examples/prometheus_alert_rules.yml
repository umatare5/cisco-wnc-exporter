---
# Alerting rules for cisco-wnc-exporter.
# P and R below are defined in the README, under Prometheus Configuration.
groups:
  - name: cisco-wnc-exporter
    rules:
      - alert: WNCRefreshFailing
        expr: wnc_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cisco-wnc-exporter is getting none of the WNC data it asked for"
          description: >-
            Every data type the enabled collectors read failed: an unreachable
            controller, or a reachable one refusing those models. Scrapes
            still return 200, carrying no WNC data, so the target's own up
            stays 1 and cannot detect this.

      - alert: WNCDataStale
        expr: time() - wnc_refresh_success_timestamp_seconds > 300
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter is serving a stale snapshot"
          description: >-
            The refresh behind the served snapshot is older than the
            threshold, so its series are frozen at their last reading or
            withheld entirely. A partly failed refresh still publishes and
            advances this timestamp, so silence is not completeness.

      - alert: WNCDataTypeFailing
        expr: increase(wnc_refresh_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter cannot fetch {{ $labels.data }}"
          description: >-
            This data type's fetch failed, so the series read from it are
            withheld rather than published as zero. wnc_up stays 1 while any
            other type still succeeds, so WNCRefreshFailing staying silent is
            no evidence the rest of the data arrived.

      - alert: WNCAPInventoryEmpty
        expr: >-
          wnc_up == 1
          and on(job, instance) wnc_refresh_errors_total{data="ap_capwap_data"}
          unless on(job, instance) wnc_refresh_items{data="ap_capwap_data"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter reached the WNC but sees no APs"
          description: >-
            The AP inventory fetch returned no AP, so every series keyed from
            it is gone while wnc_up stays 1. A failed inventory fetch drops
            the items series and fires this as well, with the radio series
            unaffected, so check WNCDataTypeFailing first.

      - alert: WNCWLANPolicyBindingAmbiguous
        expr: >-
          count by (job, instance, id)
          (count by (job, instance, id, policy_profile) (wnc_wlan_policy_binding))
          > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter cannot say which policy profile WLAN {{ $labels.id }} reports"
          description: >-
            Binding a WLAN to a different policy profile per site is
            legitimate and needs no fix. Either way the six wnc_wlan series
            read from the policy profile are unusable here, so take the
            profiles from wnc_wlan_policy_binding and silence this id.

      - alert: WNCAPNotJoining
        expr: >-
          rate(wnc_ap_discovery_requests_total[15m]) > 0
          and wnc_ap_joined == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "AP {{ $labels.mac }} reaches the WNC but holds no CAPWAP session"
          description: >-
            This AP keeps sending CAPWAP discovery and holds no session here,
            so no join completes. An AP whose secondary this controller is, or
            that discovers by broadcast, DHCP option 43 or DNS, fires here
            while joining elsewhere; exclude it by mac.

      - alert: WNCControllerBootTimeMissing
        expr: >-
          wnc_refresh_items{data="controller_boot_time"} == 0
          or (
          wnc_refresh_items{data="controller_boot_time"} == 1
          unless on(job, instance) wnc_controller_boot_time_seconds
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter has no controller boot time to anchor counters to"
          description: >-
            Nothing dates the controller's last reboot while this fires, so a
            rise on the four controller counters cannot be gated on its age. A
            read that failed silences both clauses and raises
            wnc_refresh_errors_total, so silence here is not proof.

      - alert: WNCBandAirQualityDipping
        expr: >-
          wnc_rrm_worst_channel_air_quality_index_avg
          - wnc_rrm_worst_channel_air_quality_index_min > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The worst channel of band {{ $labels.band }} dips below its own average air quality"
          description: >-
            Air quality on this band's worst channel dipped well below its own
            average, a burst the average hides. Read
            wnc_rrm_worst_channel_number, then wnc_ap_air_quality_index_min
            per radio; absence there is a missing CleanAir row, not clean air.

      - alert: WNCClientSessionFlapping
        expr: >-
          resets(wnc_client_uptime_seconds[3h]) > 3
          and max_over_time(wnc_client_uptime_seconds[3h]) < 300
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.mac }} cannot hold an association"
          description: >-
            This client keeps losing and rebuilding its association. A roam
            restarts the association-time leaf too, so a client that roams
            often fires here with nothing wrong.
            wnc_controller_client_deletes_total gives the reasons,
            controller-wide.

      - alert: WNCRadioChannelChurning
        expr: increase(wnc_ap_channel_changes_total[1h]) >= 4
        labels:
          severity: warning
        annotations:
          summary: "Radio {{ $labels.radio }} on AP {{ $labels.mac }} is moved to another channel repeatedly"
          description: >-
            This radio's channel keeps being reassigned rather than holding an
            assignment. What the counter counts is not established, so a
            radar-driven move may be in it;
            wnc_ap_last_radar_timestamp_seconds needs --collector.ap.errors to
            answer that.

      - alert: WNCWLANOnboardingStalled
        expr: wnc_wlan_onboarding_clients > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "WLAN {{ $labels.id }} holds a client in the {{ $labels.phase }} phase"
          description: >-
            Onboarding is not completing in this phase on this WLAN. The count
            is per WLAN and phase rather than per client, so a queue of
            successive slow clients holds it above zero with nothing stuck.
            Name the client with wnc_client_state.

      - alert: WNCRadioRRMProfilesFailing
        expr: >-
          count by (job, instance, mac, radio)
          (wnc_ap_rrm_profile_passed{profile!="load"} == 0) >= 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Radio {{ $labels.radio }} on AP {{ $labels.mac }} fails two RRM profiles at once"
          description: >-
            Two RRM verdicts other than load are failing together on this
            radio. Read wnc_ap_rrm_profile_passed for this mac and radio to
            see which two; interference and noise both fail in ordinary
            conditions, coverage has never been observed to.
