include_fragments = "full"
require_https = true
exclude_all_private = true
# cisco.com answers an automated request with 403, and the changelog names the
# tag the merge of its own release pull request creates, so the release link
# 404s until that merge lands.
exclude = [
  "^https://www\\.cisco\\.com/",
  "^https://github\\.com/umatare5/cisco-wnc-exporter/releases/tag/",
  "^https://github\\.com/umatare5/cisco-wnc-exporter/compare/",
]
