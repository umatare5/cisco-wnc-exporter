name: govulncheck

on:
  push:
    branches: ["main"]
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/go-vulncheck.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"
      - ".github/workflows/go-vulncheck.yml"
  schedule:
    - cron: "30 2 * * 1" # every Monday at 2:30, after the coverage run

permissions:
  contents: read

jobs:
  go-vulncheck:
    uses: umatare5/common/.github/workflows/go-vulncheck.yml@ec6477148fb47ffc8b34a89dfdc2ec725a82863a # v0.18.0
