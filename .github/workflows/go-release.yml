name: Release Application

on:
  push:
    branches: ["main"]
    paths: ["VERSION"]
  # A push that creates the branch carries no path comparison, so the filter
  # above cannot match the commit that first adds VERSION. The manual trigger
  # covers that, and any later release the file change did not reach.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  tagging:
    uses: umatare5/common/.github/workflows/tagging.yml@ae7dde8aa1448a79660db0d935bbf865d85f58c5 # v0.17.0

  release:
    needs: tagging
    uses: umatare5/common/.github/workflows/go-release.yml@ae7dde8aa1448a79660db0d935bbf865d85f58c5 # v0.17.0
    with:
      go_version: "1.27.0"
      goreleaser_version: "v2.18.0"
