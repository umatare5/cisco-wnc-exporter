---
# Alerting rules for cisco-wnc-exporter.
# P and R below are defined in the README, under Prometheus Configuration.
groups:
  - name: cisco-wnc-exporter
    rules:
      - alert: WNCRefreshFailing
        expr: wnc_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cisco-wnc-exporter is getting none of the WNC data it asked for"
          description: >-
            wnc_up is 0 when every data type the enabled collectors read failed,
            which covers an unreachable controller and a reachable one that
            refuses those models. It is not a completeness signal: with more
            than one collector enabled, one can fail entirely while wnc_up stays
            1, which is what WNCDataTypeFailing covers. Scrapes keep returning
            200 from the cached snapshot, so the target up stays 1 and cannot
            detect this. Also fires briefly after a restart, before the first
            refresh completes.

      - alert: WNCDataStale
        expr: time() - wnc_refresh_success_timestamp_seconds > 300
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter is serving a stale snapshot"
          description: >-
            Pick the threshold above P + scrape_interval * ceil(R /
            scrape_interval), which is the largest freshness a healthy exporter
            reports, and below 3 * P + scrape_interval, which is when the
            snapshot stops being served. With the shipped defaults and a 60
            second scrape_interval that range is 180 to 420 seconds.

      - alert: WNCDataTypeFailing
        expr: increase(wnc_refresh_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter cannot fetch {{ $labels.data }}"
          description: >-
            Set for shorter than the range minus scrape_interval, otherwise the
            rule never fires for an isolated failure. If the failing data type
            is late in the fetch order and wnc_refresh_duration_seconds sits
            near twice --wnc.cache-ttl, the deadline is the cause rather than
            the controller. Exclude data types your controller legitimately
            leaves empty with a data!= matcher.

      - alert: WNCAPInventoryEmpty
        expr: >-
          wnc_up == 1
          and on(job, instance) wnc_refresh_errors_total{data="ap_capwap_data"}
          unless on(job, instance) wnc_refresh_items{data="ap_capwap_data"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter reached the WNC but sees no APs"
          description: >-
            Every AP series except the join module is labeled from the AP
            inventory, so an empty inventory silently empties the AP and radio
            series while wnc_up stays 1. The join module reads a statistics list
            that keeps a record for an AP the inventory has dropped, so its
            series survive this and WNCAPNotJoining stays useful. The and clause holds the rule silent where no AP collector
            is enabled and the inventory is never fetched: unless against an
            absent series excludes nothing, so without it the rule would fire
            continuously there.

      - alert: WNCWLANPolicyBindingAmbiguous
        expr: >-
          count by (job, instance, id)
          (count by (job, instance, id, policy_profile) (wnc_wlan_policy_binding))
          > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter cannot say which policy profile WLAN {{ $labels.id }} reports"
          description: >-
            The six wnc_wlan config series read from the policy profile name
            neither the tag nor the profile, so where a WLAN resolves to more
            than one profile they report only one of them and nothing says
            which. The inner count collapses the tags that name the same
            profile, because binding a WLAN to one profile through several tags
            is not ambiguous; counting series instead would fire on it. Needs
            --collector.wlan.config, and is silent without it. Binding one WLAN
            to a different profile per site is a legitimate design, and there is
            nothing to fix in that case: read the profiles from
            wnc_wlan_policy_binding, treat the six config series for that id as
            unusable, and silence this alert for that id.

      - alert: WNCAPNotJoining
        expr: >-
          rate(wnc_ap_discovery_requests_total[15m]) > 0
          and wnc_ap_joined == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "AP {{ $labels.mac }} reaches the WNC but holds no CAPWAP session"
          description: >-
            The join statistics keep a record for an AP that has left CAPWAP,
            and its discovery counters keep advancing while it retries, so this
            separates an AP the controller can hear from one it cannot. Both
            sides carry mac and nothing else on purpose: a bare and requires
            identical label sets, and joining wnc_ap_join_info for the name here
            would make the alert vanish whenever that series is absent. Look the
            name up with wnc_ap_join_info{mac="..."} instead. An AP that holds
            this controller as its secondary, or that discovers by broadcast,
            DHCP option 43 or DNS, sends discovery here at every boot, which is
            why for is longer than the rate range. Needs --collector.ap.join.

      - alert: WNCControllerBootTimeMissing
        expr: >-
          wnc_refresh_items{data="controller_boot_time"} == 0
          or (
          wnc_refresh_items{data="controller_boot_time"} == 1
          unless on(job, instance) wnc_controller_boot_time_seconds
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "cisco-wnc-exporter has no controller boot time to anchor counters to"
          description: >-
            Every counter the controller collector publishes is cumulative with
            no epoch leaf of its own, and this gauge is the only reset anchor a
            rule can use, so an and on() against it returns an empty result
            rather than firing while it is absent. items reads 0 when the read
            succeeded and the controller carried no such leaf; a failed read
            raises wnc_refresh_errors_total instead and removes this series,
            which is why the rule cannot be written with absent(). The second
            clause covers the one other way the gauge is withheld, where the
            read succeeded and items reads 1: the instant sat at the epoch. A
            malformed instant fails the read instead, so items goes absent and
            WNCDataTypeFailing catches it. Both clauses are anchored on an items
            series that exists only while --collector.controller.general is
            enabled, so this stays silent where it is off.

      - alert: WNCBandAirQualityDipping
        expr: >-
          wnc_rrm_worst_channel_air_quality_index_avg
          - wnc_rrm_worst_channel_air_quality_index_min > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The worst channel of band {{ $labels.band }} dips below its own average air quality"
          description: >-
            Both series read the same channel of the same report and carry band
            alone, so a bare subtraction matches them and no on() is needed. The
            index rises with cleanliness, so a wide difference is a dirty burst
            under a clean average, on the one channel the controller ranks worst
            across the APs that scan the band. A deeper dip on another channel is
            invisible here, and an AP that stops reporting raises the band reading
            with the air unchanged, so this rule fails quiet rather than loud; the
            per-radio wnc_ap_air_quality_index_avg and
            wnc_ap_air_quality_index_min follow the channel each radio operates
            on. The controller recomputes both once per air quality reporting
            period and holds them unchanged in between, so scraping more often
            adds nothing, the detection delay is at least one period plus for, and
            a held reading is indistinguishable from a stale snapshot - pair this
            with WNCDataStale. Read the period from the controller's CleanAir
            configuration and keep for well inside it: a burst that fills one
            report raises the difference for that report alone, and a for as long
            as the period stays pending and never fires. The threshold is
            provisional - 30 is a placeholder and not a measured normal. Set it
            from max_over_time((wnc_rrm_worst_channel_air_quality_index_avg -
            wnc_rrm_worst_channel_air_quality_index_min)[7d:5m]) on your own
            estate, and do not borrow the controller's air quality alarm
            threshold, which is a floor on the index itself rather than on this
            difference. wnc_rrm_worst_channel_number reports which channel of the
            band this is, in the same label set - an annotation cannot template it,
            so read it beside this alert. Needs --collector.ap.spectrum.

      - alert: WNCClientSessionFlapping
        expr: >-
          resets(wnc_client_uptime_seconds[3h]) > 3
          and max_over_time(wnc_client_uptime_seconds[3h]) < 300
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.mac }} cannot hold an association"
          description: >-
            The gauge rises with the session and drops when the association
            restarts, which is the break in monotonicity resets() counts. It counts
            a roam, a re-association to the same BSS and a disconnect-reconnect
            alike, because all three rewrite the one association-time leaf it is
            measured from, so read it as session churn rather than as roaming.
            Counting restarts alone is not enough: a client the controller drops on
            a timer returns as soon as it wakes and cycles for as long as it is on
            the network, without anything being wrong. The second clause excludes
            that class by construction, because a session the idle timeout ended
            lasted at least as long as the timeout: set 300 to the idle timeout the
            policy profiles carry, and the rule then fires only for a client whose
            longest session in the range is shorter than the shortest that timer can
            produce. A client that joined moments ago stays silent too, since it has
            no restart to count. Both clauses carry the client MAC alone, so a bare
            and matches them, and neither names the AP: an AP that loses CAPWAP
            restarts every client on it and raises one alert per client, so group by
            alertname and read WNCAPNotJoining for the AP side.
            wnc_controller_client_deletes_total names the reason the sessions end.
            No for is needed, because the range is the persistence window. Needs
            --collector.client.general.

      - alert: WNCRadioChannelChurning
        expr: increase(wnc_ap_channel_changes_total[1h]) >= 4
        labels:
          severity: warning
        annotations:
          summary: "Radio {{ $labels.radio }} on AP {{ $labels.mac }} is moved to another channel repeatedly"
          description: >-
            The controller declares a channel-assignment interval, which bounds how
            often a radio can be moved but is not an upper bound on the moves an
            hour holds. Take the threshold from your own baseline of this counter
            and keep the range well above that interval, or a healthy radio and a
            churning one both read zero. The comparison is >= 4 and not > 3 because
            increase() extrapolates to the range edges, which lifts exactly three
            moves to just above three on a radio that had already moved before the
            range began while leaving it at three on one that had not: >= 4 reads
            the same on both. The counter can fall when the controller drops the
            assignment entries it is read from, and every fall observed happened
            together with the access point booting or re-joining. increase()
            adjusts for a reset on its own, so no guard on the association uptime
            is needed and adding one would hide real churn for an hour after every
            re-association. Needs --collector.ap.radio.

      - alert: WNCWLANOnboardingStalled
        expr: wnc_wlan_onboarding_clients > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "WLAN {{ $labels.id }} holds a client in the {{ $labels.phase }} phase"
          description: >-
            The four phase counts are current counts and not rates, so a client
            that onboards normally is caught only by coincidence while one that is
            held stays counted. A slow but successful onboarding still takes a
            couple of minutes, which is why the window is minutes rather than one
            scrape: this is the min_over_time shape the WLAN page teaches,
            lengthened. The count is per WLAN and phase rather than per client, so
            a queue of successive slow clients holds it above zero with nothing
            stuck, and the client is named by wnc_client_state instead. The series
            is withheld while the statistics read fails and absence resets for,
            which is intended: pair this with WNCDataTypeFailing rather than
            reading the gap as recovery. Needs --collector.wlan.traffic.

      - alert: WNCRadioRRMProfilesFailing
        expr: >-
          count by (job, instance, mac, radio)
          (wnc_ap_rrm_profile_passed{profile!="load"} == 0) >= 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Radio {{ $labels.radio }} on AP {{ $labels.mac }} fails two RRM profiles at once"
          description: >-
            A single failed verdict is ordinary, and the series reads 0 both for a
            failed verdict and for one the controller did not report, so a rule on
            one profile fires from the first scrape on a healthy estate. Two at
            once, held for half an hour, is the shape that is not. The load verdict
            is left out because it is judged against client-count and utilization
            thresholds configured on the controller rather than against measured
            RF, so a radio that simply carries many clients fails it with nothing
            wrong in the air: read the capacity side from wnc_ap_clients and
            wnc_ap_channel_utilization_ratio instead. count by drops the profile
            label on purpose so the alert names the radio once rather than once per
            profile; read which profiles failed with
            wnc_ap_rrm_profile_passed{mac="...", radio="..."} == 0. Needs
            --collector.ap.radio.
