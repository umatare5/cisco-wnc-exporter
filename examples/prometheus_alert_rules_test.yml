---
# A firing case is asserted through the ALERTS series the rule under test
# produces, because exp_alerts also compares exp_annotations and would copy each
# rule's description into this file.
rule_files:
  - prometheus_alert_rules.yml

evaluation_interval: 1m

tests:
  # for: 5m puts the firing edge at 7m, so 6m must be silent and 9m firing.
  - interval: 1m
    input_series:
      - series: 'wnc_up{job="cisco_wnc",instance="localhost:10039"}'
        values: "1 1 0+0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: WNCRefreshFailing
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="WNCRefreshFailing"}
        eval_time: 9m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCRefreshFailing", alertstate="firing", instance="localhost:10039", job="cisco_wnc", severity="critical"}'
            value: 1

  # The ramp holds the lag at exactly 180 seconds, the largest a healthy exporter
  # reports; the rule's own description carries the formula. A lag of 0 there
  # would let a lowered threshold pass, and no firing case would let a raised one
  # pass. Freshness returns at 13m, so 20m holds only through keep_firing_for.
  - interval: 1m
    input_series:
      - series: 'wnc_refresh_success_timestamp_seconds{job="cisco_wnc",instance="localhost:10039"}'
        values: "-180+60x5 120+0x6 600+60x7"
    alert_rule_test:
      - eval_time: 5m
        alertname: WNCDataStale
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="WNCDataStale"}
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCDataStale", alertstate="firing", instance="localhost:10039", job="cisco_wnc", severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="WNCDataStale"}
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCDataStale", alertstate="firing", instance="localhost:10039", job="cisco_wnc", severity="warning"}'
            value: 1

  # The second data type never fails, and the expected sample set names one
  # series, so a comparison that admits a zero increase is caught here.
  - interval: 1m
    input_series:
      - series: 'wnc_refresh_errors_total{job="cisco_wnc",instance="localhost:10039",data="client_dc_info"}'
        values: "0+0x5 1+0x20"
      - series: 'wnc_refresh_errors_total{job="cisco_wnc",instance="localhost:10039",data="ap_capwap_data"}'
        values: "0+0x26"
    promql_expr_test:
      - expr: ALERTS{alertname="WNCDataTypeFailing"}
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCDataTypeFailing", alertstate="firing", data="client_dc_info", instance="localhost:10039", job="cisco_wnc", severity="warning"}'
            value: 1

  # A client-only deployment never fetches ap_capwap_data, so both AP series are
  # absent: the case the and clause exists for.
  - interval: 1m
    input_series:
      - series: 'wnc_up{job="cisco_wnc",instance="localhost:10039"}'
        values: "1+0x30"
      - series: 'wnc_refresh_errors_total{job="cisco_wnc",instance="localhost:10039",data="client_common_oper_data"}'
        values: "0+0x30"
      - series: 'wnc_refresh_items{job="cisco_wnc",instance="localhost:10039",data="client_common_oper_data"}'
        values: "12+0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: WNCAPInventoryEmpty
        exp_alerts: []

  # The inventory is fetched and comes back empty: items is 0 rather than absent.
  # for: 15m puts the firing edge at 15m, so 14m must be silent and 20m firing.
  - interval: 1m
    input_series:
      - series: 'wnc_up{job="cisco_wnc",instance="localhost:10039"}'
        values: "1+0x30"
      - series: 'wnc_refresh_errors_total{job="cisco_wnc",instance="localhost:10039",data="ap_capwap_data"}'
        values: "0+0x30"
      - series: 'wnc_refresh_items{job="cisco_wnc",instance="localhost:10039",data="ap_capwap_data"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: WNCAPInventoryEmpty
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="WNCAPInventoryEmpty"}
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCAPInventoryEmpty", alertstate="firing", instance="localhost:10039", job="cisco_wnc", severity="warning"}'
            value: 1

  # WLAN 1 is bound to two different profiles, which is ambiguous; WLAN 5 is bound to
  # one profile through two tags, which is not. The expected sample set names WLAN 1
  # alone, so an expression that counts series rather than distinct profiles fails
  # here.
  - interval: 1m
    input_series:
      - series: 'wnc_wlan_policy_binding{job="cisco_wnc",instance="localhost:10039",id="1",policy_profile="policy-a",policy_tag="tag-1"}'
        values: "1+0x30"
      - series: 'wnc_wlan_policy_binding{job="cisco_wnc",instance="localhost:10039",id="1",policy_profile="policy-b",policy_tag="tag-2"}'
        values: "1+0x30"
      - series: 'wnc_wlan_policy_binding{job="cisco_wnc",instance="localhost:10039",id="5",policy_profile="policy-c",policy_tag="tag-1"}'
        values: "1+0x30"
      - series: 'wnc_wlan_policy_binding{job="cisco_wnc",instance="localhost:10039",id="5",policy_profile="policy-c",policy_tag="tag-2"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: WNCWLANPolicyBindingAmbiguous
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="WNCWLANPolicyBindingAmbiguous"}
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCWLANPolicyBindingAmbiguous", alertstate="firing", id="1", instance="localhost:10039", job="cisco_wnc", severity="warning"}'
            value: 1

  # Both APs advance their discovery counter; only the one holding no session may
  # fire. rate is positive from the second sample rather than from a full range, so
  # the firing edge is for: alone, at 30m.
  - interval: 1m
    input_series:
      - series: 'wnc_ap_discovery_requests_total{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:dd:ee:ff"}'
        values: "0+1x50"
      - series: 'wnc_ap_joined{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:dd:ee:ff"}'
        values: "0+0x50"
      - series: 'wnc_ap_discovery_requests_total{job="cisco_wnc",instance="localhost:10039",mac="11:22:33:44:55:66"}'
        values: "0+1x50"
      - series: 'wnc_ap_joined{job="cisco_wnc",instance="localhost:10039",mac="11:22:33:44:55:66"}'
        values: "1+0x50"
      # A third AP holds no session and is not reaching the controller either: its
      # record survives in the statistics list with a flat counter. It must stay silent,
      # which is what pins the rate clause — without this case the rule reduced to
      # wnc_ap_joined == 0 passes, and that fires for every decommissioned AP forever.
      - series: 'wnc_ap_discovery_requests_total{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:00:00:01"}'
        values: "77+0x50"
      - series: 'wnc_ap_joined{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:00:00:01"}'
        values: "0+0x50"
    alert_rule_test:
      - eval_time: 29m
        alertname: WNCAPNotJoining
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="WNCAPNotJoining"}
        eval_time: 35m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCAPNotJoining", alertstate="firing", instance="localhost:10039", job="cisco_wnc", mac="aa:bb:cc:dd:ee:ff", severity="warning"}'
            value: 1

  # The controller module is enabled and the boot time read returned nothing, while a
  # sibling read of the same module returned plenty.
  - interval: 1m
    input_series:
      - series: 'wnc_refresh_items{job="cisco_wnc",instance="localhost:10039",data="controller_boot_time"}'
        values: "0+0x30"
      - series: 'wnc_refresh_items{job="cisco_wnc",instance="localhost:10039",data="co_client_del_reason"}'
        values: "326+0x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: WNCControllerBootTimeMissing
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="WNCControllerBootTimeMissing"}
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCControllerBootTimeMissing", alertstate="firing", data="controller_boot_time", instance="localhost:10039", job="cisco_wnc", severity="warning"}'
            value: 1

  # The healthy case: the read returned the leaf. Without it a comparison widened to
  # >= 0, or dropped altogether, fires forever on every deployment that enables the
  # module and still passes.
  - interval: 1m
    input_series:
      - series: 'wnc_refresh_items{job="cisco_wnc",instance="localhost:10039",data="controller_boot_time"}'
        values: "1+0x30"
      - series: 'wnc_controller_boot_time_seconds{job="cisco_wnc",instance="localhost:10039"}'
        values: "1767225600+0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: WNCControllerBootTimeMissing
        exp_alerts: []

  # The read succeeded and the gauge is still absent, because the leaf did not parse or
  # sat at the epoch. items alone cannot see that, which is why the rule carries the
  # second clause.
  - interval: 1m
    input_series:
      - series: 'wnc_refresh_items{job="cisco_wnc",instance="localhost:10039",data="controller_boot_time"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: WNCControllerBootTimeMissing
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="WNCControllerBootTimeMissing"}
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCControllerBootTimeMissing", alertstate="firing", data="controller_boot_time", instance="localhost:10039", job="cisco_wnc", severity="warning"}'
            value: 1

  # The module is disabled, so the series does not exist and the rule must be silent
  # rather than firing on every deployment that never enabled it.
  - interval: 1m
    input_series:
      - series: 'wnc_refresh_items{job="cisco_wnc",instance="localhost:10039",data="ap_capwap_data"}'
        values: "3+0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: WNCControllerBootTimeMissing
        exp_alerts: []

  # The average holds while the minimum drops, which is what the pair exists to
  # separate. The dip fills one reporting period and no more, so the rule has to fire
  # inside one: a for as long as a period would stay pending and never fire, which the
  # firing cases at 12m and 19m rule out, and dropping for altogether fires at 9m.
  # Band 5 sits at exactly the threshold and must stay silent, so a comparison widened
  # to >= or to a lower threshold fails here, and band 6 dips deeper than the threshold
  # for four minutes, which is shorter than for and is why 3m is silent too.
  - interval: 1m
    input_series:
      - series: 'wnc_rrm_worst_channel_air_quality_index_avg{job="cisco_wnc",instance="localhost:10039",band="2.4"}'
        values: "95+0x40"
      - series: 'wnc_rrm_worst_channel_air_quality_index_min{job="cisco_wnc",instance="localhost:10039",band="2.4"}'
        values: "90+0x4 60+0x14 90+0x21"
      - series: 'wnc_rrm_worst_channel_air_quality_index_avg{job="cisco_wnc",instance="localhost:10039",band="5"}'
        values: "100+0x40"
      - series: 'wnc_rrm_worst_channel_air_quality_index_min{job="cisco_wnc",instance="localhost:10039",band="5"}'
        values: "70+0x40"
      - series: 'wnc_rrm_worst_channel_air_quality_index_avg{job="cisco_wnc",instance="localhost:10039",band="6"}'
        values: "96+0x40"
      - series: 'wnc_rrm_worst_channel_air_quality_index_min{job="cisco_wnc",instance="localhost:10039",band="6"}'
        values: "60+0x3 96+0x36"
    alert_rule_test:
      - eval_time: 3m
        alertname: WNCBandAirQualityDipping
        exp_alerts: []
      - eval_time: 9m
        alertname: WNCBandAirQualityDipping
        exp_alerts: []
      - eval_time: 25m
        alertname: WNCBandAirQualityDipping
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="WNCBandAirQualityDipping"}
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCBandAirQualityDipping", alertstate="firing", band="2.4", instance="localhost:10039", job="cisco_wnc", severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="WNCBandAirQualityDipping"}
        eval_time: 19m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCBandAirQualityDipping", alertstate="firing", band="2.4", instance="localhost:10039", job="cisco_wnc", severity="warning"}'
            value: 1

  # Three restarts must stay silent and fourteen must fire, so a threshold widened to
  # > 2 fails at 15m. The second client restarts as often but every session outlives
  # the idle timeout, which is what the second clause exists for: dropping it makes
  # this case fire. The third holds one session throughout.
  - interval: 1m
    input_series:
      - series: 'wnc_client_uptime_seconds{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:dd:ee:ff"}'
        values: "60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3 60+60x3"
      - series: 'wnc_client_uptime_seconds{job="cisco_wnc",instance="localhost:10039",mac="11:22:33:44:55:66"}'
        values: "60+60x7 60+60x7 60+60x7 60+60x7 60+60x7 60+60x7 60+60x7 60+60x7"
      - series: 'wnc_client_uptime_seconds{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:00:00:01"}'
        values: "60+60x59"
    alert_rule_test:
      - eval_time: 15m
        alertname: WNCClientSessionFlapping
        exp_alerts: []
    promql_expr_test:
      - expr: ALERTS{alertname="WNCClientSessionFlapping"}
        eval_time: 59m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCClientSessionFlapping", alertstate="firing", instance="localhost:10039", job="cisco_wnc", mac="aa:bb:cc:dd:ee:ff", severity="warning"}'
            value: 1

  # The first radio is moved four times in the hour. The second is moved three times
  # from a counter that was already non-zero when the range opened, which extrapolates
  # to just above three and is the case that pins >= 4 against > 3. The third is moved
  # three times after the AP re-associated, and increase() adjusts for the restart on
  # its own, so it must read three and stay silent rather than adding the pre-restart
  # total.
  - interval: 1m
    input_series:
      - series: 'wnc_ap_channel_changes_total{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:dd:ee:ff",radio="0"}'
        values: "0+0x14 1+0x14 2+0x14 3+0x14 4+0x14"
      - series: 'wnc_ap_channel_changes_total{job="cisco_wnc",instance="localhost:10039",mac="11:22:33:44:55:66",radio="0"}'
        values: "9+0x18 10+0x18 11+0x18 12+0x18"
      - series: 'wnc_ap_channel_changes_total{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:00:00:01",radio="1"}'
        values: "7+0x19 0+0x14 1+0x14 2+0x14 3+0x11"
    promql_expr_test:
      - expr: ALERTS{alertname="WNCRadioChannelChurning"}
        eval_time: 70m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCRadioChannelChurning", alertstate="firing", instance="localhost:10039", job="cisco_wnc", mac="aa:bb:cc:dd:ee:ff", radio="0", severity="warning"}'
            value: 1

  # One phase holds a client throughout, so the 14m silent case and the 15m firing case
  # pin for: 15m from both sides. The second WLAN recovers before the window closes and
  # is the control that must stay silent at 20m.
  - interval: 1m
    input_series:
      - series: 'wnc_wlan_onboarding_clients{job="cisco_wnc",instance="localhost:10039",id="1",phase="l2auth"}'
        values: "1+0x30"
      - series: 'wnc_wlan_onboarding_clients{job="cisco_wnc",instance="localhost:10039",id="1",phase="iplearn"}'
        values: "0+0x30"
      - series: 'wnc_wlan_onboarding_clients{job="cisco_wnc",instance="localhost:10039",id="5",phase="iplearn"}'
        values: "1+0x9 0+0x21"
    alert_rule_test:
      - eval_time: 14m
        alertname: WNCWLANOnboardingStalled
        exp_alerts: []
    promql_expr_test:
      # The firing edge itself, so a for lengthened inside the window below is caught.
      - expr: ALERTS{alertname="WNCWLANOnboardingStalled",alertstate="firing"}
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCWLANOnboardingStalled", alertstate="firing", id="1", instance="localhost:10039", job="cisco_wnc", phase="l2auth", severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="WNCWLANOnboardingStalled"}
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCWLANOnboardingStalled", alertstate="firing", id="1", instance="localhost:10039", job="cisco_wnc", phase="l2auth", severity="warning"}'
            value: 1

  # The first radio fails two RF profiles throughout, and its load verdict passes, so
  # the alert names it alone. The second fails one for the whole test, which is the
  # ordinary case a >= 1 comparison would fire on. The third fails two RF profiles for
  # twenty minutes only, which pins for: 30m; dropping for makes the first radio fire
  # at 29m. The fourth fails load and interference for the whole test and must stay
  # silent, because the load verdict is not counted: dropping the profile!="load"
  # matcher makes it the second firing radio at 35m.
  - interval: 1m
    input_series:
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:dd:ee:ff",radio="0",profile="interference"}'
        values: "0+0x40"
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:dd:ee:ff",radio="0",profile="noise"}'
        values: "0+0x40"
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:dd:ee:ff",radio="0",profile="load"}'
        values: "1+0x40"
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:dd:ee:ff",radio="0",profile="coverage"}'
        values: "1+0x40"
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="11:22:33:44:55:66",radio="1",profile="interference"}'
        values: "0+0x40"
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="11:22:33:44:55:66",radio="1",profile="noise"}'
        values: "1+0x40"
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:00:00:01",radio="2",profile="interference"}'
        values: "0+0x19 1+0x21"
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:00:00:01",radio="2",profile="noise"}'
        values: "0+0x19 1+0x21"
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:00:00:02",radio="0",profile="load"}'
        values: "0+0x40"
      - series: 'wnc_ap_rrm_profile_passed{job="cisco_wnc",instance="localhost:10039",mac="aa:bb:cc:00:00:02",radio="0",profile="interference"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 29m
        alertname: WNCRadioRRMProfilesFailing
        exp_alerts: []
    promql_expr_test:
      # The firing edge itself, so a for lengthened inside the window below is caught.
      - expr: ALERTS{alertname="WNCRadioRRMProfilesFailing",alertstate="firing"}
        eval_time: 30m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCRadioRRMProfilesFailing", alertstate="firing", instance="localhost:10039", job="cisco_wnc", mac="aa:bb:cc:dd:ee:ff", radio="0", severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="WNCRadioRRMProfilesFailing"}
        eval_time: 35m
        exp_samples:
          - labels: 'ALERTS{alertname="WNCRadioRRMProfilesFailing", alertstate="firing", instance="localhost:10039", job="cisco_wnc", mac="aa:bb:cc:dd:ee:ff", radio="0", severity="warning"}'
            value: 1
